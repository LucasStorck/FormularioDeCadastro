<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <title>Formulário de Cadastro |</title>
  </head>
  <body>
    <main class="container">
      <div class="form-image">
        <img src="/assets/img/form.svg" alt="Banner" />
      </div>
      <div class="form">
        <form action="/register" method="POST">
          <div class="form-header">
            <div class="title">
              <h1>Cadastrar</h1>
            </div>
          </div>
          <div class="input-group">
            <div class="input-box">
              <label for="name">Nome Completo</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Nome"
                required
              />
              <span id="name-error" class="error-message"></span>
            </div>

            <div class="input-box">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
              />
              <span id="email-error" class="error-message"></span>
            </div>

            <div class="input-box">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Senha"
                required
              />
              <span id="password-erro" class="error-message"></span>
            </div>

            <div class="input-box">
              <label for="confirmPassword">Confirmar Senha</label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirmar Senha"
                required
              />
              <span id="confirmPassword-error" class="error-message"></span>
            </div>
          </div>

          <div class="buttons">
            <button type="submit" value="Send" name="Continuar">
              Continuar
            </button>
            <button type="reset" value="Reset" name="Limpar">
              Limpar
            </button>
          </div>
          <div class="switch-form" style="text-align: center; margin-top: 1.5rem;">
            <span style="color: #e6e6e6; font-size: 0.9rem;">Já tem uma conta? <a href="/login.html" style="color: #fff; font-weight: bold; text-decoration: underline;">Entrar</a></span>
          </div>
        </form>
      </div>
    </main>
    <script src="/assets/js/script.js"></script>
  </body>
</html>
