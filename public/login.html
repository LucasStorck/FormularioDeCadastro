<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <title>Login |</title>
  </head>
  <body>
    <main class="container">
      <div class="form-image">
        <img src="/assets/img/form.svg" alt="Banner" />
      </div>
      <div class="form">
        <form action="/login" method="POST">
          <div class="form-header">
            <div class="title">
              <h1>Entrar</h1>
            </div>
          </div>
          <div class="input-group">
            <div class="input-box">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
              />
            </div>
            <div class="input-box">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Senha"
                required
              />
            </div>
          </div>
          <div class="buttons">
            <button type="submit">Entrar</button>
          </div>
          <div class="switch-form" style="text-align: center; margin-top: 1.5rem;">
            <span style="color: #e6e6e6; font-size: 0.9rem;">Ainda não tem uma conta? <a href="/index.html" style="color: #fff; font-weight: bold; text-decoration: underline;">Cadastrar</a></span>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
